# Only the per-function settings this project relies on.
# Shopify calls these two directly, without a Supabase login token.
[functions.shopify-webhook]
verify_jwt = false

[functions.shopify-callback]
verify_jwt = false

# Called from the Brand Portal by a signed-in user.
[functions.shopify-install]
verify_jwt = true

# Called from the Admin panel by a signed-in V360 admin.
[functions.manage-user]
verify_jwt = true

# Called from the ops portal (V360 / KBB) to fulfill the Shopify order.
[functions.shopify-fulfill]
verify_jwt = true

# Called from the ops portal (V360) when an invoice is marked paid.
[functions.shopify-payment-sync]
verify_jwt = true
